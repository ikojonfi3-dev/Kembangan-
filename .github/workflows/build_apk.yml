name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract ZIP File If Present
      run: |
        echo "=== Extracting ZIP file if present ==="
        shopt -s nullglob
        for zipfile in *.zip; do
          echo "Extracting $zipfile..."
          unzip -o -q "$zipfile"
        done
        
        ROOT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)
        if [ -n "$ROOT_DIR" ] && [ "$ROOT_DIR" != "." ]; then
          echo "Moving files from $ROOT_DIR to workspace root..."
          cp -rn "$ROOT_DIR"/* . || true
        fi
        
        if [ ! -f ".env" ]; then
          touch .env
        fi
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Build APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace || (gradle wrapper && ./gradlew assembleDebug --no-daemon)

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KembanganBot-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
