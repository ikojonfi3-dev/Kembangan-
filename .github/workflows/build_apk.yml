name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract ZIP File
      run: |
        echo "=== Checking and Extracting ZIP ==="
        shopt -s nullglob
        for zipfile in *.zip; do
          echo "Extracting $zipfile..."
          unzip -o -q "$zipfile"
        done
        
        # Cari direktori tempat settings.gradle.kts atau build.gradle.kts berada
        ROOT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)
        if [ -n "$ROOT_DIR" ] && [ "$ROOT_DIR" != "." ]; then
          echo "Found project root in $ROOT_DIR, syncing to workspace root..."
          cp -rn "$ROOT_DIR"/* . || true
        fi
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: KembanganBot-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
